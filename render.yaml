services:
  - type: web
    name: binance-hunter
    env: python
    buildCommand: "pip install -r requirements.txt && apt-get update && apt-get install -y --no-install-recommends curl gnupg && curl -fsSL https://deb.nodesource.com/setup_20.x | bash - && apt-get install -y --no-install-recommends nodejs && rm -rf /var/lib/apt/lists/*"
    startCommand: "python app.py"
    envVars:
      - key: HUNTER_PORT
        value: 10000
      - key: BINANCE_API_KEY
        sync: false
      - key: BINANCE_API_SECRET
        sync: false
    disk:
      name: hunter-data
      mountPath: /app
      sizeGB: 1
