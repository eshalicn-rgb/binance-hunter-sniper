services:
  - type: web
    name: binance-hunter
    env: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python app.py"
    envVars:
      - key: HUNTER_PORT
        value: 10000
      - key: BINANCE_API_KEY
        sync: false
      - key: BINANCE_API_SECRET
        sync: false
    disk:
      name: hunter-data
      mountPath: /app
      sizeGB: 1
