app = "binance-hunter-4564"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile"

[env]
  HUNTER_PORT = "4564"
  HUNTER_LIVE_ORDERS = "0"
  HUNTER_TZ = "Asia/Riyadh"
  HUNTER_START_BALANCE = "100.0"
  HUNTER_TARGET_BALANCE = "200.0"

[experimental]
  auto_rollback = true

[[services]]
  internal_port = 4564
  http_port = 80

  [services.http_options]
    force_https = true

  [[services.ports]]
    port = 80
    handlers = ["http"]
    force_https = true

  [[services.checks]]
    type = "http"
    path = "/api/status"
    interval = "30s"
    timeout = "5s"
    restart_limit = 0

[[processes]]
  cmd = "python app.py"

[deploy]
  release_command = ""
